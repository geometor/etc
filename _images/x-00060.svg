<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.998698 -1.857530 3.320419 2.490315" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 36, 58 }" class="highlight-segment" points="1.333333,-1.632993 0.610738,-0.284952" style="display: none;" />
    <polyline id="highlight-{ 28, 81 }" class="highlight-segment" points="0.628463,-0.438185 0.584893,-0.250982" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <circle id="circumcircle" class="circle circumcircle" data-category="elements" cx="0.500000" cy="-0.102062" r="0.510310" fill="none" />
    <line id="{ 36, 58 }" class="line central_line" data-category="elements" x1="723.92840" y1="-1349.67432" x2="-721.26174" y2="1346.40834" />
    <line id="{ 28, 81 }" class="line central_line" data-category="elements" x1="44.19798" y1="-187.64101" x2="-42.94106" y2="186.76463" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.020753"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.020753"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.020753"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(3)" class="point center" data-category="points" cx="0.500000" cy="-0.102062" r="0.020753"><title>X(3) (0.5000, 0.1021)</title></circle>
    <circle id="X(36)" class="point center" data-category="points" cx="1.333333" cy="-1.632993" r="0.020753"><title>X(36) (1.3333, 1.6330)</title></circle>
    <circle id="X(58)" class="point center" data-category="points" cx="0.610738" cy="-0.284952" r="0.020753"><title>X(58) (0.6107, 0.2850)</title></circle>
    <circle id="X(28)" class="point center" data-category="points" cx="0.628463" cy="-0.438185" r="0.020753"><title>X(28) (0.6285, 0.4382)</title></circle>
    <circle id="X(81)" class="point center" data-category="points" cx="0.584893" cy="-0.250982" r="0.020753"><title>X(81) (0.5849, 0.2510)</title></circle>
    <circle id="X(60)" class="point selected target" data-category="points" cx="0.579033" cy="-0.225805" r="0.029054"><title>X(60) (0.5790, 0.2258)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.066408" y="0.062258" font-size="0.056032">A</text>
    <text class="given-label" x="1.033204" y="0.062258" font-size="0.056032">B</text>
    <text class="point-label" x="0.591492" y="-0.641380" font-size="0.056032">C</text>
    <text class="point-label" x="0.533204" y="-0.131116" font-size="0.056032">X(3)</text>
    <text class="point-label" x="1.366538" y="-1.662047" font-size="0.056032">X(36)</text>
    <text class="point-label" x="0.643942" y="-0.314005" font-size="0.056032">X(58)</text>
    <text class="point-label" x="0.661667" y="-0.467239" font-size="0.056032">X(28)</text>
    <text class="point-label" x="0.618097" y="-0.280036" font-size="0.056032">X(81)</text>
    <text class="target-label" x="0.612238" y="-0.254858" font-size="0.056032">X(60)</text>
    <text class="point-label" x="-0.940591" y="0.582979" font-size="0.047731" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
