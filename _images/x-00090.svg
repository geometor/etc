    <text class="point-label" x="0.614105" y="-0.365268" font-size="0.020587">X(33)</text>
    <text class="point-label" x="0.740080" y="-0.449593" font-size="0.020587">X(47)</text>
    <text class="target-label" x="0.114376" y="-0.030759" font-size="0.020587">X(90)</text>
    <text class="point-label" x="-0.088650" y="0.139262" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
