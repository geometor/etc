    <line id="{ 4, 9 }" class="line central_line" data-category="elements" x1="101.86813" y1="-234.64182" x2="-100.64365" y2="233.85032" />
    <line id="{ 1, 28 }" class="line central_line" data-category="elements" x1="-56.46279" y1="204.66700" x2="57.60565" y2="-205.13356" />
    <line id="{ 6, 34 }" class="line central_line" data-category="elements" x1="-32.60463" y1="211.69518" x2="33.80463" y2="-212.22962" />
  </g>
