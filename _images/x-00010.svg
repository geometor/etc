    <circle id="M_b" class="point midpoint guide" data-category="points" cx="0.306122" cy="-0.299938" r="0.004880"><title>M_b (0.3061, 0.2999)</title></circle>
    <circle id="M_c" class="point midpoint guide" data-category="points" cx="0.500000" cy="-0.000000" r="0.004880"><title>M_c (0.5000, 0.0000)</title></circle>
