    <circle id="X(21)" class="point center" data-category="points" cx="0.528676" cy="-0.177092" r="0.007625"><title>X(21) (0.5287, 0.1771)</title></circle>
    <circle id="X(35)" class="point center" data-category="points" cx="0.537313" cy="-0.170611" r="0.007625"><title>X(35) (0.5373, 0.1706)</title></circle>
    <circle id="X(10)" class="point selected target" data-category="points" cx="0.520408" cy="-0.183295" r="0.010675"><title>X(10) (0.5204, 0.1833)</title></circle>
  </g>
