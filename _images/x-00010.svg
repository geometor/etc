    <line id="{ 1, 2 }" class="line central_line" data-category="elements" x1="34.58503" y1="-33.55967" x2="-33.44217" y2="33.09311" />
    <line id="{ 4, 9 }" class="line central_line" data-category="elements" x1="101.86813" y1="-234.64182" x2="-100.64365" y2="233.85032" />
    <line id="{ 21, 35 }" class="line central_line" data-category="elements" x1="-8.10905" y1="-6.65792" x2="9.16641" y2="6.30374" />
  </g>
  <g id="points">
