    <line id="{ 54, 69 }" class="line central_line" data-category="elements" x1="176.39276" y1="-152.34031" x2="-175.21666" y2="151.90519" />
    <line id="{ 2, 97 }" class="line central_line" data-category="elements" x1="58.13402" y1="-124.57008" x2="-57.05920" y2="124.17016" />
    <line id="{ 76, 96 }" class="line central_line" data-category="elements" x1="551.45594" y1="-158.65509" x2="-550.54258" y2="158.37745" />
  </g>
