<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-1.566547 -3.193790 5.278663 3.958998" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
    <polygon id="&lt; B C A&#x27; &gt;" class="polygon secondary" data-category="graphics" points="1.000000,-0.000000 0.612245,-0.599875 1.325629,-0.635743" />
    <polygon id="&lt; C A B&#x27; &gt;" class="polygon secondary" data-category="graphics" points="0.612245,-0.599875 0.000000,-0.000000 -0.213385,-0.830157" />
    <polygon id="&lt; A B C&#x27; &gt;" class="polygon secondary" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.500000,0.866025" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 3, 6 }" class="highlight-segment" points="0.500000,-0.102062 0.600000,-0.267217" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <circle id="circumcircle" class="circle circumcircle" data-category="elements" cx="0.500000" cy="-0.102062" r="0.510310" fill="none" />
    <line id="{ 3, 6 }" class="line central_line" data-category="elements" x1="-99.50000" y1="165.05293" x2="100.50000" y2="-165.25705" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.032992"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.032992"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.032992"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(3)" class="point center" data-category="points" cx="0.500000" cy="-0.102062" r="0.032992"><title>X(3) (0.5000, 0.1021)</title></circle>
    <circle id="A&#x27;" class="point guide" data-category="points" cx="1.325629" cy="-0.635743" r="0.021115"><title>A&#x27; (1.3256, 0.6357)</title></circle>
    <circle id="B&#x27;" class="point guide" data-category="points" cx="-0.213385" cy="-0.830157" r="0.021115"><title>B&#x27; (-0.2134, 0.8302)</title></circle>
    <circle id="C&#x27;" class="point guide" data-category="points" cx="0.500000" cy="0.866025" r="0.021115"><title>C&#x27; (0.5000, -0.8660)</title></circle>
    <circle id="X(6)" class="point center" data-category="points" cx="0.600000" cy="-0.267217" r="0.032992"><title>X(6) (0.6000, 0.2672)</title></circle>
    <circle id="X(50)" class="point selected target" data-category="points" cx="2.155881" cy="-2.836832" r="0.046188"><title>X(50) (2.1559, 2.8368)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.105573" y="0.098975" font-size="0.089077">A</text>
    <text class="given-label" x="1.052787" y="0.098975" font-size="0.089077">B</text>
    <text class="point-label" x="0.579253" y="-0.665858" font-size="0.089077">C</text>
    <text class="point-label" x="0.552787" y="-0.148250" font-size="0.089077">X(3)</text>
    <text class="point-label" x="0.652787" y="-0.313405" font-size="0.089077">X(6)</text>
    <text class="target-label" x="2.208667" y="-2.883020" font-size="0.089077">X(50)</text>
    <text class="point-label" x="-1.474170" y="0.686027" font-size="0.075881" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
