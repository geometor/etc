<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-1.150370 -1.814599 3.257506 2.443130" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 20, 68 }" class="highlight-segment" points="0.387755,0.191627 -0.053545,0.005514" style="display: none;" />
    <polyline id="highlight-{ 24, 64 }" class="highlight-segment" points="0.662722,-0.527824 0.557895,-1.594317" style="display: none;" />
    <polyline id="highlight-{ 35, 73 }" class="highlight-segment" points="0.537313,-0.170611 0.548708,-0.142846" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <circle id="circumcircle" class="circle circumcircle" data-category="elements" cx="0.500000" cy="-0.102062" r="0.510310" fill="none" />
    <line id="{ 20, 68 }" class="line central_line" data-category="elements" x1="441.68744" y1="186.30418" x2="-440.91192" y2="-185.92092" />
    <line id="{ 24, 64 }" class="line central_line" data-category="elements" x1="105.48987" y1="1065.96522" x2="-104.16443" y2="-1067.02086" />
    <line id="{ 35, 73 }" class="line central_line" data-category="elements" x1="-10.85701" y1="-27.93552" x2="11.93163" y2="27.59430" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.020359"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.020359"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.020359"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(3)" class="point center" data-category="points" cx="0.500000" cy="-0.102062" r="0.020359"><title>X(3) (0.5000, 0.1021)</title></circle>
    <circle id="X(20)" class="point center" data-category="points" cx="0.387755" cy="0.191627" r="0.020359"><title>X(20) (0.3878, -0.1916)</title></circle>
    <circle id="X(68)" class="point center" data-category="points" cx="-0.053545" cy="0.005514" r="0.020359"><title>X(68) (-0.0535, -0.0055)</title></circle>
    <circle id="X(24)" class="point center" data-category="points" cx="0.662722" cy="-0.527824" r="0.020359"><title>X(24) (0.6627, 0.5278)</title></circle>
    <circle id="X(64)" class="point center" data-category="points" cx="0.557895" cy="-1.594317" r="0.020359"><title>X(64) (0.5579, 1.5943)</title></circle>
