    <text class="point-label" x="0.581283" y="-0.171349" font-size="0.054970">X(73)</text>
    <text class="target-label" x="0.780962" y="0.315216" font-size="0.054970">X(74)</text>
    <text class="point-label" x="-1.093364" y="0.579668" font-size="0.046827" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
