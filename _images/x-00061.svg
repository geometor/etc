    <text class="given-label" x="1.012200" y="0.022875" font-size="0.020587">B</text>
    <text class="point-label" x="0.604620" y="-0.615125" font-size="0.020587">C</text>
    <text class="point-label" x="0.512200" y="-0.112737" font-size="0.020587">X(3)</text>
    <text class="point-label" x="0.612200" y="-0.277892" font-size="0.020587">X(6)</text>
    <text class="point-label" x="0.624445" y="-0.406426" font-size="0.020587">X(4)</text>
    <text class="point-label" x="0.600101" y="-0.292620" font-size="0.020587">X(13)</text>
    <text class="point-label" x="0.568322" y="-0.259581" font-size="0.020587">X(5)</text>
    <text class="point-label" x="0.925643" y="0.103637" font-size="0.020587">X(14)</text>
    <text class="target-label" x="0.588620" y="-0.238949" font-size="0.020587">X(61)</text>
    <text class="point-label" x="-0.088650" y="0.196418" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
