    <text class="point-label" x="0.549615" y="-0.210633" font-size="0.020587">X(2)</text>
    <text class="point-label" x="0.589983" y="-0.241200" font-size="0.020587">X(39)</text>
    <text class="point-label" x="0.624445" y="-0.406426" font-size="0.020587">X(4)</text>
