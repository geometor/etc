    <text class="point-label" x="0.532608" y="-0.193970" font-size="0.020587">X(10)</text>
    <text class="point-label" x="0.510960" y="-0.178864" font-size="0.020587">X(75)</text>
    <text class="target-label" x="0.468878" y="-0.149499" font-size="0.020587">X(76)</text>
    <text class="point-label" x="-0.088650" y="0.139262" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
