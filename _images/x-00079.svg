<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.944725 -1.850927 3.222784 2.417088" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 1, 30 }" class="highlight-segment" points="0.571429,-0.233285 0.327904,0.348226" style="display: none;" />
    <polyline id="highlight-{ 9, 46 }" class="highlight-segment" points="0.510989,-0.161505 0.691729,-0.454291" style="display: none;" />
    <polyline id="highlight-{ 21, 36 }" class="highlight-segment" points="0.528676,-0.177092 1.333333,-1.632993" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <line id="{ 1, 30 }" class="line central_line" data-category="elements" x1="244.09564" y1="-581.74427" x2="-242.95278" y2="581.27771" />
    <line id="{ 9, 46 }" class="line central_line" data-category="elements" x1="-180.22932" y1="292.62501" x2="181.25130" y2="-292.94801" />
    <line id="{ 21, 36 }" class="line central_line" data-category="elements" x1="-804.12895" y1="1455.72401" x2="805.18631" y2="-1456.07819" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.020142"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.020142"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.020142"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(1)" class="point center" data-category="points" cx="0.571429" cy="-0.233285" r="0.020142"><title>X(1) (0.5714, 0.2333)</title></circle>
    <circle id="X(30)" class="point center" data-category="points" cx="0.327904" cy="0.348226" r="0.020142"><title>X(30) (0.3279, -0.3482)</title></circle>
    <circle id="X(9)" class="point center" data-category="points" cx="0.510989" cy="-0.161505" r="0.020142"><title>X(9) (0.5110, 0.1615)</title></circle>
    <circle id="X(46)" class="point center" data-category="points" cx="0.691729" cy="-0.454291" r="0.020142"><title>X(46) (0.6917, 0.4543)</title></circle>
    <circle id="X(21)" class="point center" data-category="points" cx="0.528676" cy="-0.177092" r="0.020142"><title>X(21) (0.5287, 0.1771)</title></circle>
    <circle id="X(36)" class="point center" data-category="points" cx="1.333333" cy="-1.632993" r="0.020142"><title>X(36) (1.3333, 1.6330)</title></circle>
    <circle id="X(79)" class="point selected target" data-category="points" cx="0.597646" cy="-0.301884" r="0.028199"><title>X(79) (0.5976, 0.3019)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.064456" y="0.060427" font-size="0.054384">A</text>
    <text class="given-label" x="1.032228" y="0.060427" font-size="0.054384">B</text>
    <text class="point-label" x="0.592103" y="-0.640160" font-size="0.054384">C</text>
    <text class="point-label" x="0.603656" y="-0.261484" font-size="0.054384">X(1)</text>
    <text class="point-label" x="0.360132" y="0.320027" font-size="0.054384">X(30)</text>
    <text class="point-label" x="0.543217" y="-0.189704" font-size="0.054384">X(9)</text>
    <text class="point-label" x="0.723957" y="-0.482491" font-size="0.054384">X(46)</text>
    <text class="point-label" x="0.560904" y="-0.205291" font-size="0.054384">X(21)</text>
    <text class="point-label" x="1.365561" y="-1.661193" font-size="0.054384">X(36)</text>
    <text class="target-label" x="0.629874" y="-0.330083" font-size="0.054384">X(79)</text>
    <text class="point-label" x="-0.888326" y="0.517819" font-size="0.046328" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
