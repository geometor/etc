    <line id="{ 1, 2 }" class="line central_line" data-category="elements" x1="71.62130" y1="-36.80338" x2="-70.39054" y2="36.54334" />
    <line id="{ 4, 9 }" class="line central_line" data-category="elements" x1="131.59216" y1="-795.88489" x2="-130.32588" y2="794.22609" />
    <line id="{ 21, 35 }" class="line central_line" data-category="elements" x1="-40.19289" y1="-41.54317" x2="41.26993" y2="41.45355" />
  </g>
  <g id="points">
