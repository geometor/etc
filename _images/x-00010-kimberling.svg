    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.008432"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.633136" cy="-0.280051" r="0.008432"><title>C (0.6331, 0.2801)</title></circle>
