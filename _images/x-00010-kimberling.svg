    <circle id="X(35)" class="point center" data-category="points" cx="0.579256" cy="-0.003308" r="0.008432"><title>X(35) (0.5793, 0.0033)</title></circle>
    <circle id="X(10)" class="point selected target" data-category="points" cx="0.508876" cy="-0.075014" r="0.011805"><title>X(10) (0.5089, 0.0750)</title></circle>
