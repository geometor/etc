    <circle id="M_b" class="point midpoint guide" data-category="points" cx="0.316568" cy="-0.140026" r="0.005397"><title>M_b (0.3166, 0.1400)</title></circle>
    <circle id="M_c" class="point midpoint guide" data-category="points" cx="0.500000" cy="-0.000000" r="0.005397"><title>M_c (0.5000, 0.0000)</title></circle>
