    <text class="point-label" x="0.652181" y="-0.343923" font-size="0.020587">X(32)</text>
    <text class="point-label" x="0.594534" y="-0.235056" font-size="0.020587">X(41)</text>
    <text class="target-label" x="0.635007" y="-0.311490" font-size="0.020587">X(31)</text>
    <text class="point-label" x="-0.088650" y="0.139262" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
