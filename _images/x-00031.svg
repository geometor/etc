    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.007625"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.007625"><title>C (0.6122, 0.5999)</title></circle>
