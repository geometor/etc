    <circle id="X(41)" class="point center" data-category="points" cx="0.582334" cy="-0.224381" r="0.007625"><title>X(41) (0.5823, 0.2244)</title></circle>
    <circle id="X(31)" class="point selected target" data-category="points" cx="0.622807" cy="-0.300815" r="0.010675"><title>X(31) (0.6228, 0.3008)</title></circle>
  </g>
