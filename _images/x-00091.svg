<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.206017 -0.786768 1.325532 0.994149" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 65, 68 }" class="highlight-segment" points="0.604082,-0.293272 -0.053545,0.005514" style="display: none;" />
    <polyline id="highlight-{ 47, 92 }" class="highlight-segment" points="0.727880,-0.438918 0.594912,-0.363909" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <line id="{ 65, 68 }" class="line central_line" data-category="elements" x1="658.23029" y1="-299.07971" x2="-657.02213" y2="298.49317" />
    <line id="{ 47, 92 }" class="line central_line" data-category="elements" x1="133.69539" y1="-75.44808" x2="-132.23963" y2="74.57024" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.008285"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.008285"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.008285"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(65)" class="point center" data-category="points" cx="0.604082" cy="-0.293272" r="0.008285"><title>X(65) (0.6041, 0.2933)</title></circle>
    <circle id="X(68)" class="point center" data-category="points" cx="-0.053545" cy="0.005514" r="0.008285"><title>X(68) (-0.0535, -0.0055)</title></circle>
    <circle id="X(47)" class="point center" data-category="points" cx="0.727880" cy="-0.438918" r="0.008285"><title>X(47) (0.7279, 0.4389)</title></circle>
    <circle id="X(92)" class="point center" data-category="points" cx="0.594912" cy="-0.363909" r="0.008285"><title>X(92) (0.5949, 0.3639)</title></circle>
    <circle id="X(91)" class="point selected target" data-category="points" cx="-0.086501" cy="0.020488" r="0.011598"><title>X(91) (-0.0865, -0.0205)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.026511" y="0.024854" font-size="0.022368">A</text>
    <text class="given-label" x="1.013255" y="0.024854" font-size="0.022368">B</text>
    <text class="point-label" x="0.603960" y="-0.616444" font-size="0.022368">C</text>
    <text class="point-label" x="0.617337" y="-0.304871" font-size="0.022368">X(65)</text>
    <text class="point-label" x="-0.040289" y="-0.006084" font-size="0.022368">X(68)</text>
    <text class="point-label" x="0.741135" y="-0.450516" font-size="0.022368">X(47)</text>
    <text class="point-label" x="0.608168" y="-0.375507" font-size="0.022368">X(92)</text>
    <text class="target-label" x="-0.073246" y="0.008889" font-size="0.022368">X(91)</text>
    <text class="point-label" x="-0.182820" y="0.187498" font-size="0.019055" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
