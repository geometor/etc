    <line id="{ 1, 11 }" class="line central_line" data-category="elements" x1="-40.27808" y1="-123.55569" x2="41.50884" y2="123.29565" />
    <line id="{ 13, 18 }" class="line central_line" data-category="elements" x1="-2255.48190" y1="-139.61363" x2="2256.74660" y2="139.06703" />
  </g>
