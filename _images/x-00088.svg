    <text class="point-label" x="0.549615" y="-0.210633" font-size="0.020587">X(2)</text>
    <text class="point-label" x="0.553979" y="-0.208747" font-size="0.020587">X(45)</text>
    <text class="point-label" x="0.612200" y="-0.277892" font-size="0.020587">X(6)</text>
    <text class="point-label" x="0.608530" y="-0.280344" font-size="0.020587">X(89)</text>
    <text class="point-label" x="0.583629" y="-0.243960" font-size="0.020587">X(1)</text>
    <text class="point-label" x="0.155057" y="-0.477244" font-size="0.020587">X(100)</text>
    <text class="target-label" x="1.012200" y="-0.010675" font-size="0.020587">X(88)</text>
    <text class="point-label" x="-0.088650" y="0.139262" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
