    <circle id="incircle" class="circle incircle" data-category="elements" cx="0.571429" cy="-0.233285" r="0.233285" fill="none" />
    <line id="{ 1, 3 }" class="line central_line" data-category="elements" x1="72.00000" y1="-131.45595" x2="-70.85714" y2="130.98939" />
    <line id="{ 2, 11 }" class="line central_line" data-category="elements" x1="-196.74150" y1="-133.50553" x2="197.81632" y2="133.10561" />
    <line id="{ 4, 12 }" class="line central_line" data-category="elements" x1="48.73896" y1="-155.40077" x2="-47.51448" y2="154.60927" />
  </g>
  <g id="points">
