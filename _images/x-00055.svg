    <text class="point-label" x="0.554017" y="-0.214485" font-size="0.028016">X(2)</text>
    <text class="point-label" x="0.751296" y="-0.081180" font-size="0.028016">X(11)</text>
    <text class="point-label" x="0.628847" y="-0.410278" font-size="0.028016">X(4)</text>
