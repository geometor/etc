    <circle id="X(12)" class="point center" data-category="points" cx="0.564118" cy="-0.240746" r="0.010376"><title>X(12) (0.5641, 0.2407)</title></circle>
    <circle id="X(55)" class="point selected target" data-category="points" cx="0.549020" cy="-0.192117" r="0.014527"><title>X(55) (0.5490, 0.1921)</title></circle>
  </g>
