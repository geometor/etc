    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <line id="{ 4, 9 }" class="line central_line" data-category="elements" x1="101.86813" y1="-234.64182" x2="-100.64365" y2="233.85032" />
    <line id="{ 6, 31 }" class="line central_line" data-category="elements" x1="-22.20702" y1="33.33025" x2="23.40702" y2="-33.86469" />
    <line id="{ 3, 48 }" class="line central_line" data-category="elements" x1="-40.66223" y1="22.38620" x2="41.66223" y2="-22.59032" />
  </g>
