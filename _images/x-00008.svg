    <circle id="incircle" class="circle incircle" data-category="elements" cx="0.571429" cy="-0.233285" r="0.233285" fill="none" />
    <line id="[ A N_a ]" class="line bisector" data-category="elements" x1="-767.34694" y1="359.92502" x2="767.34694" y2="-359.92502" />
    <line id="[ B N_b ]" class="line bisector" data-category="elements" x1="592.83673" y1="399.91669" x2="-590.83673" y2="-399.91669" />
    <line id="[ C N_c ]" class="line bisector" data-category="elements" x1="41.42857" y1="-600.47492" x2="-40.20409" y2="599.27516" />
