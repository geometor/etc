    <line id="{ 20, 40 }" class="line central_line" data-category="elements" x1="-40.42857" y1="162.65779" x2="41.20409" y2="-162.27453" />
    <line id="{ 7, 65 }" class="line central_line" data-category="elements" x1="-13.22448" y1="16.12997" x2="14.40502" y2="-16.68371" />
  </g>
  <g id="points">
