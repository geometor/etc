<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" height="100%">
  <defs>
    <filter id="glow-coord" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="960">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Shaded Barycentric Sub-Triangles: u = Area(X_n BC), v = Area(X_n CA), w = Area(X_n AB) -->
  <polygon points="570.4,398.0 890.0,614.0 587.6,146.0"
           fill="rgba(232, 184, 90, 0.19)" stroke="none" />
  <polygon points="570.4,398.0 587.6,146.0 110.0,614.0"
           fill="rgba(56, 189, 248, 0.17)" stroke="none" />
  <polygon points="570.4,398.0 110.0,614.0 890.0,614.0"
           fill="rgba(94, 194, 126, 0.17)" stroke="none" />

  <!-- Extended sidelines (when pedal feet fall outside segment) -->
  <line x1="890.0" y1="614.0" x2="697.4" y2="315.9" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,5" />
  <line x1="587.6" y1="146.0" x2="452.9" y2="278.0" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,5" />
  <line x1="110.0" y1="614.0" x2="570.4" y2="614.0" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,5" />

  <!-- Reference Triangle ABC (dotted so only perpendicular struts are solid) -->
  <polygon points="110.0,614.0 890.0,614.0 587.6,146.0"
           fill="none" stroke="#cbd5e1" stroke-width="2.6" stroke-dasharray="2, 4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Barycentric partition spokes (dash-dot) from X_n to vertices A, B, C -->
  <line x1="570.4" y1="398.0" x2="110.0" y2="614.0" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="10,5,2.5,5" opacity="0.65" />
  <line x1="570.4" y1="398.0" x2="890.0" y2="614.0" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="10,5,2.5,5" opacity="0.65" />
  <line x1="570.4" y1="398.0" x2="587.6" y2="146.0" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="10,5,2.5,5" opacity="0.65" />

  <!-- Right-angle markers at pedal feet -->
  <path d="M 705.0,327.7 L 693.2,335.3 L 685.6,323.5" fill="none" stroke="#e8b85a" stroke-width="2.4" opacity="0.9" />
  <path d="M 462.9,268.2 L 472.7,278.2 L 462.7,288.0" fill="none" stroke="#38bdf8" stroke-width="2.4" opacity="0.9" />
  <path d="M 556.4,614.0 L 556.4,600.0 L 570.4,600.0" fill="none" stroke="#5ec27e" stroke-width="2.4" opacity="0.9" />

  <!-- Three Directed Perpendicular Struts (alpha, beta, gamma) -->
  <line x1="570.4" y1="398.0" x2="697.4" y2="315.9"
        stroke="#e8b85a" stroke-width="5.0" stroke-linecap="round" filter="url(#glow-coord)" />
  <line x1="570.4" y1="398.0" x2="452.9" y2="278.0"
        stroke="#38bdf8" stroke-width="5.0" stroke-linecap="round" filter="url(#glow-coord)" />
  <line x1="570.4" y1="398.0" x2="570.4" y2="614.0"
        stroke="#5ec27e" stroke-width="5.0" stroke-linecap="round" filter="url(#glow-coord)" />

  <!-- Pedal feet -->
  <circle cx="697.4" cy="315.9" r="5.8" fill="#e8b85a" stroke="#0d111a" stroke-width="2" />
  <circle cx="452.9" cy="278.0" r="5.8" fill="#38bdf8" stroke="#0d111a" stroke-width="2" />
  <circle cx="570.4" cy="614.0" r="5.8" fill="#5ec27e" stroke="#0d111a" stroke-width="2" />

  <!-- Vertices A, B, C -->
  <circle cx="110.0" cy="614.0" r="7.2" fill="#66ff66" stroke="#0d111a" stroke-width="2.2" />
  <circle cx="890.0" cy="614.0" r="7.2" fill="#66ff66" stroke="#0d111a" stroke-width="2.2" />
  <circle cx="587.6" cy="146.0" r="7.2" fill="#f8f6f0" stroke="#0d111a" stroke-width="2.2" />

  <text x="78.0" y="640.0" fill="#88ff88" font-family="Georgia, serif" font-size="28" font-weight="bold">A</text>
  <text x="906.0" y="640.0" fill="#88ff88" font-family="Georgia, serif" font-size="28" font-weight="bold">B</text>
  <text x="577.6" y="128.0" fill="#f8f6f0" font-family="Georgia, serif" font-size="28" font-weight="bold">C</text>

  <!-- Strut Labels alpha, beta, gamma -->
  <g font-family="Georgia, serif" font-size="26" font-weight="bold">
    <rect x="643.9" y="327.0" width="34" height="30" rx="6" fill="rgba(13, 17, 26, 0.86)" />
    <text x="651.9" y="351.0" fill="#e8b85a">α</text>
    <rect x="477.6" y="308.0" width="34" height="30" rx="6" fill="rgba(13, 17, 26, 0.86)" />
    <text x="485.6" y="332.0" fill="#38bdf8">β</text>
    <rect x="582.4" y="488.0" width="34" height="30" rx="6" fill="rgba(13, 17, 26, 0.86)" />
    <text x="590.4" y="512.0" fill="#5ec27e">γ</text>
  </g>

  <!-- Center X_n -->
  <circle cx="570.4" cy="398.0" r="10.5" fill="#ffd700" stroke="#00ffff" stroke-width="3" filter="url(#glow-coord)" />
  <rect x="536.4" y="352.0" width="68" height="30" rx="6" fill="rgba(13, 17, 26, 0.92)" stroke="#e8b85a" stroke-width="1.5" />
  <text x="570.4" y="373.0" text-anchor="middle" fill="#ffd700" font-family="JetBrains Mono, monospace" font-size="19" font-weight="bold">X<tspan dy="0.28em" font-size="74%">7</tspan></text>
</svg>