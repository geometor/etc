    <circle id="T_b" class="point guide" data-category="points" cx="0.408163" cy="-0.399917" r="0.004880"><title>T_b (0.4082, 0.3999)</title></circle>
    <circle id="T_c" class="point guide" data-category="points" cx="0.571429" cy="-0.000000" r="0.004880"><title>T_c (0.5714, 0.0000)</title></circle>
