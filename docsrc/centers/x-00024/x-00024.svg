    <text class="given-label" x="1.016602" y="0.031129" font-size="0.028016">B</text>
    <text class="point-label" x="0.601869" y="-0.620628" font-size="0.028016">C</text>
    <text class="point-label" x="0.516602" y="-0.116589" font-size="0.028016">X(3)</text>
    <text class="point-label" x="0.554017" y="-0.214485" font-size="0.028016">X(2)</text>
    <text class="point-label" x="0.616602" y="-0.281744" font-size="0.028016">X(6)</text>
    <text class="point-label" x="0.604652" y="-0.232090" font-size="0.028016">X(54)</text>
    <text class="point-label" x="0.618507" y="-0.369120" font-size="0.028016">X(33)</text>
    <text class="point-label" x="0.553916" y="-0.185138" font-size="0.028016">X(35)</text>
    <text class="target-label" x="0.679324" y="-0.542351" font-size="0.028016">X(24)</text>
    <text class="point-label" x="-0.301051" y="0.495613" font-size="0.023866" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
