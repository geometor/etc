    <circle id="X(33)" class="point center" data-category="points" cx="0.601905" cy="-0.354593" r="0.010376"><title>X(33) (0.6019, 0.3546)</title></circle>
    <circle id="X(35)" class="point center" data-category="points" cx="0.537313" cy="-0.170611" r="0.010376"><title>X(35) (0.5373, 0.1706)</title></circle>
    <circle id="X(24)" class="point selected target" data-category="points" cx="0.662722" cy="-0.527824" r="0.014527"><title>X(24) (0.6627, 0.5278)</title></circle>
  </g>
  <g id="labels">
