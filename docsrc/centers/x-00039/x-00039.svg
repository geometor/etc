    <text class="point-label" x="0.577340" y="-0.246663" font-size="0.020587">X(83)</text>
    <text class="point-label" x="0.123102" y="-0.442918" font-size="0.020587">X(99)</text>
    <text class="target-label" x="0.589983" y="-0.241200" font-size="0.020587">X(39)</text>
    <text class="point-label" x="-0.088650" y="0.139262" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
