    <text class="given-label" x="1.012200" y="0.022875" font-size="0.020587">B</text>
    <text class="point-label" x="0.604620" y="-0.615125" font-size="0.020587">C</text>
    <text class="point-label" x="0.549615" y="-0.210633" font-size="0.020587">X(2)</text>
    <text class="point-label" x="0.652181" y="-0.343923" font-size="0.020587">X(32)</text>
    <text class="point-label" x="0.612200" y="-0.277892" font-size="0.020587">X(6)</text>
    <text class="point-label" x="0.468878" y="-0.149499" font-size="0.020587">X(76)</text>
    <text class="point-label" x="0.532608" y="-0.193970" font-size="0.020587">X(10)</text>
    <text class="point-label" x="0.606480" y="-0.280990" font-size="0.020587">X(82)</text>
    <text class="target-label" x="0.577340" y="-0.246663" font-size="0.020587">X(83)</text>
    <text class="point-label" x="-0.088650" y="0.139262" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
