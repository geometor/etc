    <text class="point-label" x="0.604620" y="-0.615125" font-size="0.020587">C</text>
    <text class="point-label" x="0.523189" y="-0.172180" font-size="0.020587">X(9)</text>
    <text class="point-label" x="0.540876" y="-0.187767" font-size="0.020587">X(21)</text>
    <text class="point-label" x="0.635007" y="-0.311490" font-size="0.020587">X(31)</text>
