    <line id="{ 2, 37 }" class="line central_line" data-category="elements" x1="-18.78994" y1="15.68458" x2="19.86476" y2="-16.08450" />
    <line id="{ 19, 27 }" class="line central_line" data-category="elements" x1="7.08068" y1="-13.56583" x2="-5.83144" y2="12.71707" />
  </g>
