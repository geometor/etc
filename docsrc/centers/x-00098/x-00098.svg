    <text class="given-label" x="1.016602" y="0.031129" font-size="0.028016">B</text>
    <text class="point-label" x="0.601869" y="-0.620628" font-size="0.028016">C</text>
    <text class="point-label" x="0.516602" y="-0.116589" font-size="0.028016">X(3)</text>
    <text class="point-label" x="0.628847" y="-0.410278" font-size="0.028016">X(4)</text>
    <text class="point-label" x="0.656584" y="-0.347775" font-size="0.028016">X(32)</text>
    <text class="point-label" x="0.473280" y="-0.153351" font-size="0.028016">X(76)</text>
    <text class="point-label" x="0.572725" y="-0.263433" font-size="0.028016">X(5)</text>
    <text class="point-label" x="0.581742" y="-0.250515" font-size="0.028016">X(83)</text>
    <text class="target-label" x="0.905700" y="0.213592" font-size="0.028016">X(98)</text>
    <text class="point-label" x="-0.301051" y="0.495613" font-size="0.023866" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
