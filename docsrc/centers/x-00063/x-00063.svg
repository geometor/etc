    <text class="given-label" x="1.012875" y="0.024141" font-size="0.021727">B</text>
    <text class="point-label" x="0.604198" y="-0.615969" font-size="0.021727">C</text>
    <text class="point-label" x="0.550290" y="-0.211224" font-size="0.021727">X(2)</text>
    <text class="point-label" x="0.603142" y="-0.288131" font-size="0.021727">X(7)</text>
    <text class="point-label" x="0.584304" y="-0.244550" font-size="0.021727">X(1)</text>
    <text class="point-label" x="0.541551" y="-0.188358" font-size="0.021727">X(21)</text>
    <text class="point-label" x="0.482263" y="-0.144571" font-size="0.021727">X(8)</text>
    <text class="point-label" x="0.400630" y="0.180361" font-size="0.021727">X(20)</text>
    <text class="target-label" x="0.469458" y="-0.093601" font-size="0.021727">X(63)</text>
    <text class="point-label" x="-0.121223" y="0.259379" font-size="0.018508" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
