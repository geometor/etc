<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.143755 -0.686940 1.287510 0.965632" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 2, 7 }" class="highlight-segment" points="0.537415,-0.199958 0.590267,-0.276865" style="display: none;" />
    <polyline id="highlight-{ 1, 21 }" class="highlight-segment" points="0.571429,-0.233285 0.528676,-0.177092" style="display: none;" />
    <polyline id="highlight-{ 8, 20 }" class="highlight-segment" points="0.469388,-0.133306 0.387755,0.191627" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <line id="{ 2, 7 }" class="line central_line" data-category="elements" x1="-52.31450" y1="76.70709" x2="53.38932" y2="-77.10701" />
    <line id="{ 1, 21 }" class="line central_line" data-category="elements" x1="43.32430" y1="-56.42596" x2="-42.18144" y2="55.95940" />
    <line id="{ 8, 20 }" class="line central_line" data-category="elements" x1="82.10205" y1="-325.06562" x2="-81.16327" y2="324.79900" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.008047"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.008047"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.008047"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(2)" class="point center" data-category="points" cx="0.537415" cy="-0.199958" r="0.008047"><title>X(2) (0.5374, 0.2000)</title></circle>
    <circle id="X(7)" class="point center" data-category="points" cx="0.590267" cy="-0.276865" r="0.008047"><title>X(7) (0.5903, 0.2769)</title></circle>
    <circle id="X(1)" class="point center" data-category="points" cx="0.571429" cy="-0.233285" r="0.008047"><title>X(1) (0.5714, 0.2333)</title></circle>
    <circle id="X(21)" class="point center" data-category="points" cx="0.528676" cy="-0.177092" r="0.008047"><title>X(21) (0.5287, 0.1771)</title></circle>
    <circle id="X(8)" class="point center" data-category="points" cx="0.469388" cy="-0.133306" r="0.008047"><title>X(8) (0.4694, 0.1333)</title></circle>
    <circle id="X(20)" class="point center" data-category="points" cx="0.387755" cy="0.191627" r="0.008047"><title>X(20) (0.3878, -0.1916)</title></circle>
    <circle id="X(63)" class="point selected target" data-category="points" cx="0.456583" cy="-0.082336" r="0.011266"><title>X(63) (0.4566, 0.0823)</title></circle>
  </g>
  <g id="labels">
