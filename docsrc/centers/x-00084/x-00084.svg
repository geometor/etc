    <text class="point-label" x="0.514205" y="-0.114491" font-size="0.023971">X(3)</text>
    <text class="point-label" x="0.525194" y="-0.173934" font-size="0.023971">X(9)</text>
    <text class="point-label" x="0.483593" y="-0.145735" font-size="0.023971">X(8)</text>
