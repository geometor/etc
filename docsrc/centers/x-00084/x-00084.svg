    <text class="point-label" x="0.626450" y="-0.408180" font-size="0.023971">X(4)</text>
    <text class="point-label" x="0.627962" y="-0.323476" font-size="0.023971">X(57)</text>
    <text class="target-label" x="0.621348" y="-0.694058" font-size="0.023971">X(84)</text>
    <text class="point-label" x="-0.185389" y="0.266377" font-size="0.020420" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
