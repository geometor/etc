<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.861972 -0.480005 2.723944 2.042958" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.633136,-0.280051" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.633136,-0.280051" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.633136,-0.280051 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 2, 3 }" class="highlight-segment" points="0.544379,-0.093350 0.500000,0.274675" style="display: none;" />
    <polyline id="highlight-{ 1, 7 }" class="highlight-segment" points="0.615385,-0.130024 0.628782,-0.211359" style="display: none;" />
    <polyline id="highlight-{ 8, 40 }" class="highlight-segment" points="0.402367,-0.020004 0.384615,0.679374" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="367.86391" y1="280.05111" x2="-365.86391" y2="-280.05111" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="633.76923" y1="-280.33116" x2="-632.50295" y2="279.77106" />
    <circle id="circumcircle" class="circle circumcircle" data-category="elements" cx="0.500000" cy="0.274675" r="0.570479" fill="none" />
    <line id="{ 2, 3 }" class="line golden euler" data-category="elements" x1="44.92308" y1="-368.11885" x2="-43.83432" y2="367.93215" />
    <line id="{ 1, 7 }" class="line central_line" data-category="elements" x1="-12.78196" y1="81.20558" x2="14.01272" y2="-81.46562" />
    <line id="{ 8, 40 }" class="line central_line" data-category="elements" x1="18.15385" y1="-699.39765" x2="-17.34911" y2="699.35765" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.017025"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.017025"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.633136" cy="-0.280051" r="0.017025"><title>C (0.6331, 0.2801)</title></circle>
    <circle id="X(3)" class="point center" data-category="points" cx="0.500000" cy="0.274675" r="0.017025"><title>X(3) (0.5000, -0.2747)</title></circle>
    <circle id="X(2)" class="point center" data-category="points" cx="0.544379" cy="-0.093350" r="0.017025"><title>X(2) (0.5444, 0.0934)</title></circle>
    <circle id="X(1)" class="point center" data-category="points" cx="0.615385" cy="-0.130024" r="0.017025"><title>X(1) (0.6154, 0.1300)</title></circle>
    <circle id="X(7)" class="point center" data-category="points" cx="0.628782" cy="-0.211359" r="0.017025"><title>X(7) (0.6288, 0.2114)</title></circle>
    <circle id="X(8)" class="point center" data-category="points" cx="0.402367" cy="-0.020004" r="0.017025"><title>X(8) (0.4024, 0.0200)</title></circle>
    <circle id="X(40)" class="point center" data-category="points" cx="0.384615" cy="0.679374" r="0.017025"><title>X(40) (0.3846, -0.6794)</title></circle>
    <circle id="X(20)" class="point selected target" data-category="points" cx="0.366864" cy="1.378752" r="0.023835"><title>X(20) (0.3669, -1.3788)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.054479" y="0.051074" font-size="0.045967">A</text>
    <text class="given-label" x="1.027239" y="0.051074" font-size="0.045967">B</text>
    <text class="point-label" x="0.616111" y="-0.314100" font-size="0.045967">C</text>
    <text class="point-label" x="0.527239" y="0.250841" font-size="0.045967">X(3)</text>
    <text class="point-label" x="0.571618" y="-0.117185" font-size="0.045967">X(2)</text>
    <text class="point-label" x="0.642624" y="-0.153858" font-size="0.045967">X(1)</text>
    <text class="point-label" x="0.656021" y="-0.235194" font-size="0.045967">X(7)</text>
    <text class="point-label" x="0.429606" y="-0.043838" font-size="0.045967">X(8)</text>
    <text class="point-label" x="0.411855" y="0.655539" font-size="0.045967">X(40)</text>
    <text class="target-label" x="0.394103" y="1.354917" font-size="0.045967">X(20)</text>
    <text class="point-label" x="-0.814303" y="1.522094" font-size="0.039157" fill="#999">Kimberling (6, 9, 13) | AB = 1</text>
  </g>
</svg>
