<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.330105 -0.724641 1.660210 1.245157" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 2, 3 }" class="highlight-segment" points="0.537415,-0.199958 0.500000,-0.102062" style="display: none;" />
    <polyline id="highlight-{ 1, 7 }" class="highlight-segment" points="0.571429,-0.233285 0.590267,-0.276865" style="display: none;" />
    <polyline id="highlight-{ 8, 40 }" class="highlight-segment" points="0.469388,-0.133306 0.428571,0.029161" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <circle id="circumcircle" class="circle circumcircle" data-category="elements" cx="0.500000" cy="-0.102062" r="0.510310" fill="none" />
    <line id="{ 2, 3 }" class="line golden euler" data-category="elements" x1="37.95238" y1="-98.09624" x2="-36.87756" y2="97.69632" />
    <line id="{ 1, 7 }" class="line central_line" data-category="elements" x1="-18.26688" y1="43.34738" x2="19.40974" y2="-43.81394" />
    <line id="{ 8, 40 }" class="line central_line" data-category="elements" x1="41.28572" y1="-162.59946" x2="-40.34694" y2="162.33284" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.010376"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.010376"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.010376"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(3)" class="point center" data-category="points" cx="0.500000" cy="-0.102062" r="0.010376"><title>X(3) (0.5000, 0.1021)</title></circle>
    <circle id="X(2)" class="point center" data-category="points" cx="0.537415" cy="-0.199958" r="0.010376"><title>X(2) (0.5374, 0.2000)</title></circle>
    <circle id="X(1)" class="point center" data-category="points" cx="0.571429" cy="-0.233285" r="0.010376"><title>X(1) (0.5714, 0.2333)</title></circle>
    <circle id="X(7)" class="point center" data-category="points" cx="0.590267" cy="-0.276865" r="0.010376"><title>X(7) (0.5903, 0.2769)</title></circle>
    <circle id="X(8)" class="point center" data-category="points" cx="0.469388" cy="-0.133306" r="0.010376"><title>X(8) (0.4694, 0.1333)</title></circle>
    <circle id="X(40)" class="point center" data-category="points" cx="0.428571" cy="0.029161" r="0.010376"><title>X(40) (0.4286, -0.0292)</title></circle>
    <circle id="X(20)" class="point selected target" data-category="points" cx="0.387755" cy="0.191627" r="0.014527"><title>X(20) (0.3878, -0.1916)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.033204" y="0.031129" font-size="0.028016">A</text>
    <text class="given-label" x="1.016602" y="0.031129" font-size="0.028016">B</text>
    <text class="point-label" x="0.601869" y="-0.620628" font-size="0.028016">C</text>
    <text class="point-label" x="0.516602" y="-0.116589" font-size="0.028016">X(3)</text>
    <text class="point-label" x="0.554017" y="-0.214485" font-size="0.028016">X(2)</text>
    <text class="point-label" x="0.588031" y="-0.247812" font-size="0.028016">X(1)</text>
    <text class="point-label" x="0.606869" y="-0.291392" font-size="0.028016">X(7)</text>
    <text class="point-label" x="0.485990" y="-0.147832" font-size="0.028016">X(8)</text>
    <text class="point-label" x="0.445174" y="0.014634" font-size="0.028016">X(40)</text>
    <text class="target-label" x="0.404357" y="0.177100" font-size="0.028016">X(20)</text>
    <text class="point-label" x="-0.301051" y="0.495613" font-size="0.023866" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
