    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <circle id="incircle" class="circle incircle" data-category="elements" cx="0.571429" cy="-0.233285" r="0.233285" fill="none" />
    <line id="{ 2, 3 }" class="line golden euler" data-category="elements" x1="37.95238" y1="-98.09624" x2="-36.87756" y2="97.69632" />
    <line id="{ 1, 92 }" class="line central_line" data-category="elements" x1="-22.91229" y1="130.39085" x2="24.05515" y2="-130.85741" />
    <line id="{ 33, 78 }" class="line central_line" data-category="elements" x1="219.04801" y1="-305.83481" x2="-217.84421" y2="305.12563" />
  </g>
