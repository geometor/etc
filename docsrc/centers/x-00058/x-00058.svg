    <text class="point-label" x="0.540876" y="-0.187767" font-size="0.020587">X(21)</text>
    <text class="point-label" x="0.640663" y="-0.448860" font-size="0.020587">X(28)</text>
    <text class="point-label" x="0.645405" y="-0.489854" font-size="0.020587">X(34)</text>
    <text class="target-label" x="0.622938" y="-0.295627" font-size="0.020587">X(58)</text>
    <text class="point-label" x="-0.088650" y="0.139262" font-size="0.017537" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
