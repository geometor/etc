    <polyline id="highlight-{ 28, 34 }" class="highlight-segment" points="0.628463,-0.438185 0.633205,-0.479179" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <circle id="incircle" class="circle incircle" data-category="elements" cx="0.571429" cy="-0.233285" r="0.233285" fill="none" />
    <line id="{ 3, 6 }" class="line central_line" data-category="elements" x1="-99.50000" y1="165.05293" x2="100.50000" y2="-165.25705" />
    <line id="{ 1, 21 }" class="line central_line" data-category="elements" x1="43.32430" y1="-56.42596" x2="-42.18144" y2="55.95940" />
    <line id="{ 28, 34 }" class="line central_line" data-category="elements" x1="-4.11338" y1="40.55625" x2="5.37030" y2="-41.43263" />
  </g>
  <g id="points">
