    <text class="point-label" x="0.361109" y="0.319173" font-size="0.056032">X(30)</text>
    <text class="point-label" x="0.695926" y="-0.556878" font-size="0.056032">X(24)</text>
    <text class="point-label" x="0.666409" y="-0.508233" font-size="0.056032">X(34)</text>
