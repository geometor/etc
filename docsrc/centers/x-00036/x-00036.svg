<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.998698 -1.857530 3.320419 2.490315" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
