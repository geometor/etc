    <circle id="X(34)" class="point center" data-category="points" cx="0.633205" cy="-0.479179" r="0.020753"><title>X(34) (0.6332, 0.4792)</title></circle>
    <circle id="X(36)" class="point selected target" data-category="points" cx="1.333333" cy="-1.632993" r="0.029054"><title>X(36) (1.3333, 1.6330)</title></circle>
