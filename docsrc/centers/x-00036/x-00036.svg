    <circle id="T_a" class="point guide" data-category="points" cx="0.767347" cy="-0.359925" r="0.013282"><title>T_a (0.7673, 0.3599)</title></circle>
    <circle id="T_b" class="point guide" data-category="points" cx="0.408163" cy="-0.399917" r="0.013282"><title>T_b (0.4082, 0.3999)</title></circle>
