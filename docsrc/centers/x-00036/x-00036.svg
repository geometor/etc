    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <circle id="circumcircle" class="circle circumcircle" data-category="elements" cx="0.500000" cy="-0.102062" r="0.510310" fill="none" />
    <circle id="incircle" class="circle incircle" data-category="elements" cx="0.571429" cy="-0.233285" r="0.233285" fill="none" />
    <line id="{ 1, 3 }" class="line central_line" data-category="elements" x1="72.00000" y1="-131.45595" x2="-70.85714" y2="130.98939" />
    <line id="{ 11, 30 }" class="line central_line" data-category="elements" x1="407.52421" y1="-414.94568" x2="-406.05483" y2="414.81238" />
    <line id="{ 24, 34 }" class="line central_line" data-category="elements" x1="30.17998" y1="-49.17233" x2="-28.85454" y2="48.11669" />
  </g>
  <g id="points">
