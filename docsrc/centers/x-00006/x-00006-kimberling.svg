<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.427979 -0.421309 1.855959 1.391969" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.633136,-0.280051" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.633136,-0.280051" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.633136,-0.280051 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 1, 9 }" class="highlight-segment" points="0.615385,-0.130024 0.502177,-0.034346" style="display: none;" />
    <polyline id="highlight-{ 3, 15 }" class="highlight-segment" points="0.500000,0.274675 0.600011,-0.005101" style="display: none;" />
    <polyline id="highlight-{ 13, 14 }" class="highlight-segment" points="0.632352,-0.273300 0.749475,0.231993" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="367.86391" y1="280.05111" x2="-365.86391" y2="-280.05111" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="633.76923" y1="-280.33116" x2="-632.50295" y2="279.77106" />
    <circle id="circumcircle" class="circle circumcircle" data-category="elements" cx="0.500000" cy="0.274675" r="0.570479" fill="none" />
    <line id="{ 1, 9 }" class="line central_line" data-category="elements" x1="113.82293" y1="-95.80786" x2="-112.59217" y2="95.54782" />
    <line id="{ 3, 15 }" class="line central_line" data-category="elements" x1="-99.51084" y1="280.05107" x2="100.51084" y2="-279.50171" />
    <line id="{ 13, 14 }" class="line central_line" data-category="elements" x1="-116.49075" y1="-505.56680" x2="117.75545" y2="505.02020" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.011600"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.011600"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.633136" cy="-0.280051" r="0.011600"><title>C (0.6331, 0.2801)</title></circle>
    <circle id="X(3)" class="point center" data-category="points" cx="0.500000" cy="0.274675" r="0.011600"><title>X(3) (0.5000, -0.2747)</title></circle>
    <circle id="X(1)" class="point center" data-category="points" cx="0.615385" cy="-0.130024" r="0.011600"><title>X(1) (0.6154, 0.1300)</title></circle>
    <circle id="X(9)" class="point center" data-category="points" cx="0.502177" cy="-0.034346" r="0.011600"><title>X(9) (0.5022, 0.0343)</title></circle>
    <circle id="X(15)" class="point center" data-category="points" cx="0.600011" cy="-0.005101" r="0.011600"><title>X(15) (0.6000, 0.0051)</title></circle>
    <circle id="X(13)" class="point center" data-category="points" cx="0.632352" cy="-0.273300" r="0.011600"><title>X(13) (0.6324, 0.2733)</title></circle>
    <circle id="X(14)" class="point center" data-category="points" cx="0.749475" cy="0.231993" r="0.011600"><title>X(14) (0.7495, -0.2320)</title></circle>
    <circle id="X(6)" class="point selected target" data-category="points" cx="0.657343" cy="-0.165485" r="0.016240"><title>X(6) (0.6573, 0.1655)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.037119" y="0.034799" font-size="0.031319">A</text>
    <text class="given-label" x="1.018560" y="0.034799" font-size="0.031319">B</text>
    <text class="point-label" x="0.621536" y="-0.303251" font-size="0.031319">C</text>
    <text class="point-label" x="0.518560" y="0.258435" font-size="0.031319">X(3)</text>
    <text class="point-label" x="0.633944" y="-0.146263" font-size="0.031319">X(1)</text>
    <text class="point-label" x="0.520737" y="-0.050586" font-size="0.031319">X(9)</text>
    <text class="point-label" x="0.618570" y="-0.021341" font-size="0.031319">X(15)</text>
    <text class="point-label" x="0.650911" y="-0.289540" font-size="0.031319">X(13)</text>
    <text class="point-label" x="0.768035" y="0.215754" font-size="0.031319">X(14)</text>
    <text class="target-label" x="0.675902" y="-0.181724" font-size="0.031319">X(6)</text>
    <text class="point-label" x="-0.395500" y="0.942820" font-size="0.026679" fill="#999">Kimberling (6, 9, 13) | AB = 1</text>
  </g>
</svg>
