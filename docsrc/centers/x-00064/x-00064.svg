    <text class="point-label" x="0.592496" y="-0.639373" font-size="0.053323">C</text>
    <text class="point-label" x="0.419354" y="0.163978" font-size="0.053323">X(20)</text>
    <text class="point-label" x="0.443844" y="-0.093090" font-size="0.053323">X(69)</text>
    <text class="point-label" x="0.694321" y="-0.555473" font-size="0.053323">X(24)</text>
    <text class="point-label" x="0.779986" y="0.316070" font-size="0.053323">X(74)</text>
    <text class="point-label" x="0.359503" y="0.320577" font-size="0.053323">X(30)</text>
    <text class="point-label" x="-0.021946" y="-0.022135" font-size="0.053323">X(68)</text>
    <text class="target-label" x="0.589493" y="-1.621966" font-size="0.053323">X(64)</text>
    <text class="point-label" x="-1.051410" y="0.514508" font-size="0.045423" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
