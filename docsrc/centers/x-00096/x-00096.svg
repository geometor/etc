<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="-0.214697 -0.790744 1.335072 1.001304" preserveAspectRatio="xMidYMid meet">
  <style>
:root {
    --background-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #161616;
    --border-color: #333;
    --select-color: #0ff;
}

#drawing {
    width: 100%;
    height: auto;
    max-height: 520px;
    background-color: var(--accent-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: block;
}

#points circle {
    fill: var(--text-color);
    stroke: var(--background-color);
    stroke-width: 2.5;
    vector-effect: non-scaling-stroke;
}

#points circle.given {
    fill: #6F6;
}

#points circle.guide {
    fill: orange;
    stroke-dasharray: none;
}

#points circle.selected,
#points circle.target {
    stroke: var(--select-color);
    fill: gold;
    stroke-width: 3;
}

#elements line {
    fill: none;
    stroke: #777;
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
}

#elements line.sideline {
    stroke: #999;
    stroke-width: 2;
}

#elements line.central_line {
    stroke: #0bd;
    stroke-width: 1.75;
    stroke-opacity: 0.85;
}

#elements line.golden,
#elements line.euler {
    stroke: gold;
    stroke-width: 2;
}

#elements circle {
    fill: none;
    stroke: #C09;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
}

#elements circle.incircle {
    stroke: #e040fb;
}

#elements circle.nine_point_circle {
    stroke: #00e5ff;
    stroke-dasharray: 6, 3;
}

#elements .bisector {
    stroke-dasharray: 8, 4, 2, 4;
}

#elements .guide {
    stroke: orange;
    stroke-dasharray: 2, 4;
    stroke-opacity: 0.65;
}

#graphics polyline {
    stroke: #36c9;
    fill: none;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
}

#graphics polygon {
    stroke: #36c9;
    fill: #36c2;
    stroke-width: 6;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
    marker-start: url(#marker);
    marker-mid: url(#marker);
    marker-end: url(#marker);
}

#graphics polygon.secondary {
    stroke: rgba(144, 238, 144, 0.55);
    fill: rgba(144, 238, 144, 0.08);
    stroke-width: 3;
}

#labels text {
    fill: var(--text-color);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-weight: 600;
    paint-order: stroke;
    stroke: var(--accent-color);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    user-select: none;
}

#labels text.target-label {
    fill: gold;
    font-weight: 700;
}

#labels text.given-label {
    fill: #8f8;
}
</style>
  <defs>
    <marker id="marker" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <circle cx="3" cy="3" r="3" fill="context-stroke" vector-effect="non-scaling-stroke"></circle>
    </marker>
  </defs>
  <g id="graphics">
    <polygon id="&lt; A B C &gt;" class="polygon reference" data-category="graphics" points="0.000000,-0.000000 1.000000,-0.000000 0.612245,-0.599875" />
  </g>
  <g id="highlights">
    <polyline id="highlight-[ A B ]" class="highlight-segment" points="0.000000,-0.000000 1.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-[ B C ]" class="highlight-segment" points="1.000000,-0.000000 0.612245,-0.599875" style="display: none;" />
    <polyline id="highlight-[ C A ]" class="highlight-segment" points="0.612245,-0.599875 0.000000,-0.000000" style="display: none;" />
    <polyline id="highlight-{ 2, 54 }" class="highlight-segment" points="0.537415,-0.199958 0.588050,-0.217564" style="display: none;" />
    <polyline id="highlight-{ 76, 95 }" class="highlight-segment" points="0.456678,-0.138824 0.517162,-0.156225" style="display: none;" />
  </g>
  <g id="elements">
    <line id="[ A B ]" class="line given sideline" data-category="elements" x1="-1000.00000" y1="-0.00000" x2="1000.00000" y2="-0.00000" />
    <line id="[ B C ]" class="line sideline" data-category="elements" x1="388.75510" y1="599.87504" x2="-386.75510" y2="-599.87504" />
    <line id="[ C A ]" class="line sideline" data-category="elements" x1="612.85714" y1="-600.47492" x2="-611.63266" y2="599.27516" />
    <line id="{ 2, 54 }" class="line central_line" data-category="elements" x1="-50.09723" y1="17.40535" x2="51.17205" y2="-17.80527" />
    <line id="{ 76, 95 }" class="line central_line" data-category="elements" x1="-60.02706" y1="17.26167" x2="60.94042" y2="-17.53931" />
  </g>
  <g id="points">
    <circle id="A" class="point given vertex" data-category="points" cx="0.000000" cy="-0.000000" r="0.008344"><title>A (0.0000, 0.0000)</title></circle>
    <circle id="B" class="point given vertex" data-category="points" cx="1.000000" cy="-0.000000" r="0.008344"><title>B (1.0000, 0.0000)</title></circle>
    <circle id="C" class="point vertex" data-category="points" cx="0.612245" cy="-0.599875" r="0.008344"><title>C (0.6122, 0.5999)</title></circle>
    <circle id="X(2)" class="point center" data-category="points" cx="0.537415" cy="-0.199958" r="0.008344"><title>X(2) (0.5374, 0.2000)</title></circle>
    <circle id="X(54)" class="point center" data-category="points" cx="0.588050" cy="-0.217564" r="0.008344"><title>X(54) (0.5880, 0.2176)</title></circle>
    <circle id="X(76)" class="point center" data-category="points" cx="0.456678" cy="-0.138824" r="0.008344"><title>X(76) (0.4567, 0.1388)</title></circle>
    <circle id="X(95)" class="point center" data-category="points" cx="0.517162" cy="-0.156225" r="0.008344"><title>X(95) (0.5172, 0.1562)</title></circle>
    <circle id="X(96)" class="point selected target" data-category="points" cx="-0.094321" cy="0.019692" r="0.011682"><title>X(96) (-0.0943, -0.0197)</title></circle>
  </g>
  <g id="labels">
    <text class="given-label" x="-0.026701" y="0.025033" font-size="0.022529">A</text>
    <text class="given-label" x="1.013351" y="0.025033" font-size="0.022529">B</text>
    <text class="point-label" x="0.603901" y="-0.616563" font-size="0.022529">C</text>
    <text class="point-label" x="0.550766" y="-0.211640" font-size="0.022529">X(2)</text>
    <text class="point-label" x="0.601400" y="-0.229246" font-size="0.022529">X(54)</text>
    <text class="point-label" x="0.470029" y="-0.150506" font-size="0.022529">X(76)</text>
    <text class="point-label" x="0.530512" y="-0.167907" font-size="0.022529">X(95)</text>
    <text class="target-label" x="-0.080971" y="0.008010" font-size="0.022529">X(96)</text>
    <text class="point-label" x="-0.191333" y="0.190534" font-size="0.019192" fill="#999">(a, b, c) = (5, 6, 7) | AB = 1</text>
  </g>
</svg>
