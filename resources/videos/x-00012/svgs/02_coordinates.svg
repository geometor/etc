<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" height="100%">
  <defs>
    <filter id="glow-coord" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="960">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Shaded Barycentric Sub-Triangles: u = Area(X_n BC), v = Area(X_n CA), w = Area(X_n AB) -->
  <polygon points="550.0,426.2 890.0,614.0 587.6,146.0"
           fill="rgba(232, 184, 90, 0.19)" stroke="none" />
  <polygon points="550.0,426.2 587.6,146.0 110.0,614.0"
           fill="rgba(56, 189, 248, 0.17)" stroke="none" />
  <polygon points="550.0,426.2 110.0,614.0 890.0,614.0"
           fill="rgba(94, 194, 126, 0.17)" stroke="none" />

  <!-- Extended sidelines (when pedal feet fall outside segment) -->
  <line x1="890.0" y1="614.0" x2="704.2" y2="326.5" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,5" />
  <line x1="587.6" y1="146.0" x2="428.4" y2="302.0" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,5" />
  <line x1="110.0" y1="614.0" x2="550.0" y2="614.0" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,5" />

  <!-- Reference Triangle ABC (dotted so only perpendicular struts are solid) -->
  <polygon points="110.0,614.0 890.0,614.0 587.6,146.0"
           fill="none" stroke="#cbd5e1" stroke-width="2.6" stroke-dasharray="2, 4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Barycentric partition spokes (dash-dot) from X_n to vertices A, B, C -->
  <line x1="550.0" y1="426.2" x2="110.0" y2="614.0" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="10,5,2.5,5" opacity="0.65" />
  <line x1="550.0" y1="426.2" x2="890.0" y2="614.0" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="10,5,2.5,5" opacity="0.65" />
  <line x1="550.0" y1="426.2" x2="587.6" y2="146.0" stroke="#cbd5e1" stroke-width="2.2" stroke-dasharray="10,5,2.5,5" opacity="0.65" />

  <!-- Right-angle markers at pedal feet -->
  <path d="M 711.8,338.3 L 700.0,345.9 L 692.4,334.1" fill="none" stroke="#e8b85a" stroke-width="2.4" opacity="0.9" />
  <path d="M 438.4,292.2 L 448.2,302.2 L 438.2,312.0" fill="none" stroke="#38bdf8" stroke-width="2.4" opacity="0.9" />
  <path d="M 536.0,614.0 L 536.0,600.0 L 550.0,600.0" fill="none" stroke="#5ec27e" stroke-width="2.4" opacity="0.9" />

  <!-- Three Directed Perpendicular Struts (alpha, beta, gamma) -->
  <line x1="550.0" y1="426.2" x2="704.2" y2="326.5"
        stroke="#e8b85a" stroke-width="5.0" stroke-linecap="round" filter="url(#glow-coord)" />
  <line x1="550.0" y1="426.2" x2="428.4" y2="302.0"
        stroke="#38bdf8" stroke-width="5.0" stroke-linecap="round" filter="url(#glow-coord)" />
  <line x1="550.0" y1="426.2" x2="550.0" y2="614.0"
        stroke="#5ec27e" stroke-width="5.0" stroke-linecap="round" filter="url(#glow-coord)" />

  <!-- Pedal feet -->
  <circle cx="704.2" cy="326.5" r="5.8" fill="#e8b85a" stroke="#0d111a" stroke-width="2" />
  <circle cx="428.4" cy="302.0" r="5.8" fill="#38bdf8" stroke="#0d111a" stroke-width="2" />
  <circle cx="550.0" cy="614.0" r="5.8" fill="#5ec27e" stroke="#0d111a" stroke-width="2" />

  <!-- Vertices A, B, C -->
  <circle cx="110.0" cy="614.0" r="7.2" fill="#66ff66" stroke="#0d111a" stroke-width="2.2" />
  <circle cx="890.0" cy="614.0" r="7.2" fill="#66ff66" stroke="#0d111a" stroke-width="2.2" />
  <circle cx="587.6" cy="146.0" r="7.2" fill="#f8f6f0" stroke="#0d111a" stroke-width="2.2" />

  <text x="78.0" y="640.0" fill="#88ff88" font-family="Georgia, serif" font-size="28" font-weight="bold">A</text>
  <text x="906.0" y="640.0" fill="#88ff88" font-family="Georgia, serif" font-size="28" font-weight="bold">B</text>
  <text x="577.6" y="128.0" fill="#f8f6f0" font-family="Georgia, serif" font-size="28" font-weight="bold">C</text>

  <!-- Strut Labels alpha, beta, gamma -->
  <g font-family="Georgia, serif" font-size="26" font-weight="bold">
    <rect x="637.1" y="346.3" width="34" height="30" rx="6" fill="rgba(13, 17, 26, 0.86)" />
    <text x="645.1" y="370.3" fill="#e8b85a">α</text>
    <rect x="455.2" y="334.1" width="34" height="30" rx="6" fill="rgba(13, 17, 26, 0.86)" />
    <text x="463.2" y="358.1" fill="#38bdf8">β</text>
    <rect x="562.0" y="502.1" width="34" height="30" rx="6" fill="rgba(13, 17, 26, 0.86)" />
    <text x="570.0" y="526.1" fill="#5ec27e">γ</text>
  </g>

  <!-- Center X_n -->
  <circle cx="550.0" cy="426.2" r="10.5" fill="#ffd700" stroke="#00ffff" stroke-width="3" filter="url(#glow-coord)" />
  <rect x="516.0" y="380.2" width="68" height="30" rx="6" fill="rgba(13, 17, 26, 0.92)" stroke="#e8b85a" stroke-width="1.5" />
  <text x="550.0" y="401.2" text-anchor="middle" fill="#ffd700" font-family="JetBrains Mono, monospace" font-size="19" font-weight="bold">X<tspan dy="0.28em" font-size="74%">12</tspan></text>
</svg>